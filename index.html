<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PocketPace — Legal</title>
<style>
:root{color-scheme:light dark;--bg:#fafaf9;--fg:#1c1c1a;--muted:#6b6b64;--accent:#2f6f4f;--card:#ffffff;--border:#e5e3dd;}
@media (prefers-color-scheme:dark){:root{--bg:#15161a;--fg:#e9e9e6;--muted:#9a9a92;--accent:#7fd9a8;--card:#1c1d22;--border:#2b2c33;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6;}
.wrap{max-width:640px;margin:0 auto;padding:64px 24px 80px;}
header.top{display:flex;align-items:center;gap:14px;margin-bottom:20px;}
.badge{width:44px;height:44px;border-radius:12px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#0b1f14;font-weight:700;font-size:18px;flex-shrink:0;}
h1{font-size:1.7rem;margin:0;}
.lead{color:var(--muted);font-size:1rem;margin:0 0 40px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:8px;margin:20px 0;}
.card a{display:block;padding:16px 18px;text-decoration:none;color:var(--fg);border-radius:10px;}
.card a:hover{background:var(--bg);}
.card a .t{font-weight:600;font-size:1rem;}
.card a .s{color:var(--muted);font-size:0.85rem;margin-top:2px;}
footer{margin-top:56px;color:var(--muted);font-size:0.8rem;border-top:1px solid var(--border);padding-top:20px;}
footer a{color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="badge">PP</div>
    <h1>PocketPace</h1>
  </header>
  <p class="lead">Legal documents for the PocketPace Android app.</p>

  <div class="card">
    <a href="privacy-policy.html">
      <div class="t">Privacy Policy →</div>
      <div class="s">What PocketPace does and doesn't collect, and how ads &amp; purchases work.</div>
    </a>
  </div>
  <div class="card">
    <a href="terms-of-service.html">
      <div class="t">Terms of Service →</div>
      <div class="s">The rules for using the app.</div>
    </a>
  </div>

  <footer>
    PocketPace · <a href="mailto:aswinkp740@gmail.com">aswinkp740@gmail.com</a>
  </footer>
</div>
</body>
</html>
